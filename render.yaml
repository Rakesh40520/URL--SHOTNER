# https://render.com/docs/blueprint-spec
# Configured for Neon PostgreSQL (free forever, never expires)

services:
  - type: web
    name: url-shortener
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      # Auto-generate a strong JWT secret (Render creates a random value
      # on first deploy and keeps it stable across redeploys)
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "10000"
      # Real visitor IP (X-Forwarded-For) for click location analytics only.
      # Does not affect rate limiting.
      - key: APP_GEO_TRUST_FORWARDED_FOR
        value: "true"
      # Email verification + password reset codes. Without these the app prints codes
      # to its log instead of emailing them. Fill the secret values in the Render dashboard.
      - key: MAIL_PROVIDER
        value: brevo
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      # Google Safe Browsing threat detection (malware, phishing). Optional.
      - key: SAFE_BROWSING_ENABLED
        value: "false"
      - key: SAFE_BROWSING_API_KEY
        sync: false
