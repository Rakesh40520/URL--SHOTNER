# https://render.com/docs/blueprint-spec
# One-click deploy: connect your GitHub repo on Render's dashboard,
# or click the "Deploy to Render" button if you add one to README.md.
# Render auto-discovers this file and provisions everything listed below.

databases:
  - name: url-shortener-db
    plan: free
    databaseName: urlshortener
    user: urlshortener

services:
  - type: web
    name: url-shortener
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      # Activate the Postgres profile (instead of the default H2)
      - key: SPRING_PROFILES_ACTIVE
        value: postgres

      # Database connection — pulled automatically from the managed
      # Postgres instance above (no manual copy-paste needed)
      - key: DB_HOST
        fromDatabase:
          name: url-shortener-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: url-shortener-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: url-shortener-db
          property: databaseName
      - key: DB_USER
        fromDatabase:
          name: url-shortener-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: url-shortener-db
          property: password

      # Render assigns a random port; Spring Boot reads it via ${PORT:8080}
      # (already configured in application.yml). Render sets PORT automatically,
      # so no explicit key is needed here.

      # Auto-generate a strong JWT secret (Render creates a random value
      # on first deploy and keeps it stable across redeploys)
      - key: JWT_SECRET
        generateValue: true
