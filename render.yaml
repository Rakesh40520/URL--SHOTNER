# https://render.com/docs/blueprint-spec
# Configured for Neon PostgreSQL (free forever, never expires)

services:
  - type: web
    name: url-shortener
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      # Auto-generate a strong JWT secret (Render creates a random value
      # on first deploy and keeps it stable across redeploys)
      - key: JWT_SECRET
        generateValue: true
