spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

jwt:
  secret: test-secret-key-that-is-at-least-32-bytes-long-for-hs256!
  expiration-ms: 86400000

app:
  rate-limit:
    max-requests: 100
    window-seconds: 60
  auth-rate-limit:
    max-requests: 100
    window-seconds: 60
  report-rate-limit:
    max-requests: 100
    window-seconds: 60
  safe-browsing:
    enabled: false
