<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#E6DAB8"/>
<title>Verify your email — Dispatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/nav.css"/>
</head>
<body>

<div id="site-nav"></div>

<main class="auth-page">
  <div class="auth-card">

    <a href="/login.html" class="auth-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      Back to login
    </a>

    <p class="auth-eyebrow">One more step</p>
    <h1 class="auth-title">Verify your email</h1>
    <p class="auth-lede">Enter the 6-digit code we emailed to <b id="email-shown"></b>. It expires in 10 minutes.</p>

    <div id="alert" class="auth-alert" hidden role="alert"></div>

    <div class="auth-field">
      <label for="code">Verification code</label>
      <input type="text" id="code" class="code-input" name="code" inputmode="numeric" pattern="[0-9]*"
             autocomplete="one-time-code" maxlength="6" placeholder="••••••" autofocus/>
    </div>

    <button class="auth-submit" id="verify-btn" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
      <span id="btn-label">Verify &amp; continue</span>
    </button>
    <button class="auth-secondary" id="resend-btn" type="button" disabled>Resend code</button>

    <p class="auth-divider">
      Wrong address? <a href="/register.html">Start over</a>
    </p>

  </div>
</main>

<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
  Auth.redirectIfLoggedIn('/dashboard.html');
  Nav.render();

  const params  = new URLSearchParams(window.location.search);
  const email   = (params.get('email') || '').trim();
  const alertEl = document.getElementById('alert');
  const codeEl  = document.getElementById('code');
  const verifyBtn = document.getElementById('verify-btn');
  const resendBtn = document.getElementById('resend-btn');
  const label   = document.getElementById('btn-label');

  if (!email) window.location.replace('/login.html');
  document.getElementById('email-shown').textContent = email;

  function show(msg, kind) {            // kind: 'error' (default) | 'success' | 'info'
    alertEl.textContent = msg;
    alertEl.className = 'auth-alert' + (kind && kind !== 'error' ? ' ' + kind : '');
    alertEl.hidden = false;
  }

  // ── Resend countdown (survives a page reload) ──
  const untilKey = 'dispatch_resend_until:' + email;
  let timer;
  function startCooldown(seconds) {
    sessionStorage.setItem(untilKey, String(Date.now() + seconds * 1000));
    tick();
  }
  function tick() {
    clearInterval(timer);
    const run = () => {
      const left = Math.ceil((Number(sessionStorage.getItem(untilKey) || 0) - Date.now()) / 1000);
      if (left > 0) { resendBtn.disabled = true; resendBtn.textContent = 'Resend code in ' + left + 's'; }
      else { resendBtn.disabled = false; resendBtn.textContent = 'Resend code'; clearInterval(timer); }
    };
    run(); timer = setInterval(run, 500);
  }

  async function postJson(url, body) {
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    return { res, data };
  }

  async function sendCode(auto) {
    resendBtn.disabled = true;
    try {
      const { res, data } = await postJson('/api/v1/auth/resend-code', { email });
      if (res.ok) { show('A new code is on its way. Check your inbox (and spam folder).', 'info'); startCooldown(60); }
      else if (res.status === 429) {
        // Auto request after login hits the cooldown when a code was only just sent: that's fine.
        if (auto) show('A code was sent a moment ago. Check your inbox (and spam folder).', 'info');
        else show(data.message || 'Please wait before requesting another code.');
        startCooldown(data.retryAfterSeconds || 60);
      } else { show(data.message || 'Could not send a code. Please try again.'); tick(); }
    } catch { show('Network error. Please try again.'); tick(); }
  }

  async function verify() {
    const code = codeEl.value.trim();
    if (!/^\d{6}$/.test(code)) { show('Enter the 6-digit code from the email.'); return; }
    verifyBtn.disabled = true; label.textContent = 'Verifying…'; alertEl.hidden = true;
    try {
      const { res, data } = await postJson('/api/v1/auth/verify-email', { email, code });
      if (!res.ok) throw Object.assign(new Error(data.message || 'Verification failed.'), { data });
      Auth.save({ token: data.token, name: data.name, email: data.email });
      sessionStorage.removeItem(untilKey);
      show('Email verified! Taking you to your dashboard…', 'success');
      setTimeout(() => window.location.href = '/dashboard.html', 700);
    } catch (err) {
      show(err.message);
      codeEl.value = ''; codeEl.focus();
      verifyBtn.disabled = false; label.textContent = 'Verify & continue';
    }
  }

  codeEl.addEventListener('input', () => {
    codeEl.value = codeEl.value.replace(/\D/g, '').slice(0, 6);
    if (codeEl.value.length === 6) verify();            // submit as soon as the 6th digit lands
  });
  codeEl.addEventListener('keydown', e => { if (e.key === 'Enter') verify(); });
  verifyBtn.addEventListener('click', verify);
  resendBtn.addEventListener('click', () => sendCode(false));

  // Arriving from registration: a code was just sent. Arriving from a blocked login: ask for one.
  if (params.get('sent') === '1') {
    show('We sent you a 6-digit code. Check your inbox (and spam folder).', 'info');
    if (!sessionStorage.getItem(untilKey)) startCooldown(60); else tick();
  } else if (email) {
    sendCode(true);
  }
</script>
</body>
</html>
