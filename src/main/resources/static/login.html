<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login — Dispatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/nav.css"/>
</head>
<body>

<div id="site-nav"></div>

<main class="auth-page">
  <div class="auth-card">

    <a href="/index.html" class="auth-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Home
    </a>

    <p class="auth-eyebrow">Welcome back</p>
    <h1 class="auth-title">Log in to Dispatch</h1>

    <div id="alert" class="auth-alert" hidden></div>

    <div class="auth-field">
      <label for="email">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        Email
      </label>
      <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required/>
    </div>

    <div class="auth-field">
      <label for="password">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Password
      </label>
      <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required/>
    </div>

    <button class="auth-submit" id="login-btn" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      <span id="btn-label">Log In</span>
    </button>

    <p class="auth-divider">
      Don't have an account? <a href="/register.html">Create one</a>
    </p>

  </div>
</main>

<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
  Auth.redirectIfLoggedIn('/dashboard.html');
  Nav.render();

  // Show a context message if redirected here automatically
  const reason = new URLSearchParams(window.location.search).get('reason');
  const alertEl = document.getElementById('alert');
  if (reason === 'protected') {
    alertEl.textContent = 'Please log in to access that page.';
    alertEl.hidden = false;
  } else if (reason === 'session') {
    alertEl.textContent = 'Your session has expired. Please log in again.';
    alertEl.hidden = false;
  }

  document.getElementById('login-btn').addEventListener('click', async () => {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('login-btn');
    const label    = document.getElementById('btn-label');

    alertEl.hidden = true;

    if (!email || !password) {
      alertEl.textContent = 'Please fill in both fields.';
      alertEl.hidden = false;
      return;
    }

    btn.disabled = true;
    label.textContent = 'Logging in…';

    try {
      const res = await fetch('/api/v1/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Login failed.');

      Auth.save({ token: data.token, name: data.name, email: data.email });
      window.location.href = '/dashboard.html';
    } catch (err) {
      alertEl.textContent = err.message;
      alertEl.hidden = false;
      btn.disabled = false;
      label.textContent = 'Log In';
    }
  });

  // Allow Enter key on both inputs
  ['email', 'password'].forEach(id =>
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('login-btn').click();
    })
  );
</script>
</body>
</html>
