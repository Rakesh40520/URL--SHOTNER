<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Register — Dispatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/nav.css"/>
</head>
<body>

<div id="site-nav"></div>

<main class="auth-page">
  <div class="auth-card">

    <a href="/index.html" class="auth-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Home
    </a>

    <p class="auth-eyebrow">New account</p>
    <h1 class="auth-title">Create your account</h1>

    <div id="alert" class="auth-alert" hidden></div>

    <div class="auth-field">
      <label for="name">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        Name
      </label>
      <input type="text" id="name" name="name" placeholder="Your name" autocomplete="name" required/>
    </div>

    <div class="auth-field">
      <label for="email">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        Email
      </label>
      <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required/>
    </div>

    <div class="auth-field">
      <label for="password">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Password
      </label>
      <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password" required/>
      <p class="field-hint">Minimum 8 characters</p>
    </div>

    <div class="auth-field">
      <label for="confirmPassword">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
        Confirm Password
      </label>
      <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" autocomplete="new-password" required/>
    </div>

    <button class="auth-submit" id="register-btn" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
      <span id="btn-label">Create Account</span>
    </button>

    <p class="auth-divider">
      Already have an account? <a href="/login.html">Log in</a>
    </p>

  </div>
</main>

<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
  Auth.redirectIfLoggedIn('/dashboard.html');
  Nav.render();

  const alertEl = document.getElementById('alert');

  document.getElementById('register-btn').addEventListener('click', async () => {
    const name            = document.getElementById('name').value.trim();
    const email           = document.getElementById('email').value.trim();
    const password        = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const btn             = document.getElementById('register-btn');
    const label           = document.getElementById('btn-label');

    alertEl.hidden = true;

    // Client-side validation (backend validates too, but quick feedback helps)
    if (!name || !email || !password || !confirmPassword) {
      alertEl.textContent = 'Please fill in all fields.';
      alertEl.hidden = false;
      return;
    }
    if (password.length < 8) {
      alertEl.textContent = 'Password must be at least 8 characters.';
      alertEl.hidden = false;
      return;
    }
    if (password !== confirmPassword) {
      alertEl.textContent = 'Passwords do not match.';
      alertEl.hidden = false;
      return;
    }

    btn.disabled = true;
    label.textContent = 'Creating account…';

    try {
      const res = await fetch('/api/v1/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password, confirmPassword }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Registration failed.');

      // Success — show a confirmation then redirect to login
      alertEl.textContent = 'Account created! Redirecting to login…';
      alertEl.classList.add('success');
      alertEl.hidden = false;
      setTimeout(() => window.location.href = '/login.html', 1500);
    } catch (err) {
      alertEl.textContent = err.message;
      alertEl.classList.remove('success');
      alertEl.hidden = false;
      btn.disabled = false;
      label.textContent = 'Create Account';
    }
  });

  ['name', 'email', 'password', 'confirmPassword'].forEach(id =>
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('register-btn').click();
    })
  );
</script>
</body>
</html>
