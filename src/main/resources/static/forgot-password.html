<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#E6DAB8"/>
<title>Reset password — Dispatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/nav.css"/>
</head>
<body>

<div id="site-nav"></div>

<main class="auth-page">
  <div class="auth-card">

    <a href="/login.html" class="auth-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      Back to login
    </a>

    <p class="auth-eyebrow">Forgot your password?</p>
    <h1 class="auth-title" id="title">Reset it by email</h1>
    <div class="auth-steps" aria-hidden="true"><i class="on" id="step-1"></i><i id="step-2"></i></div>

    <div id="alert" class="auth-alert" hidden role="alert"></div>

    <!-- Step 1: ask for the code -->
    <section id="step-email">
      <p class="auth-lede">Enter your account email and we'll send you a 6-digit code.</p>
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required/>
      </div>
      <button class="auth-submit" id="send-btn" type="button"><span id="send-label">Send code</span></button>
    </section>

    <!-- Step 2: code + new password -->
    <section id="step-reset" hidden>
      <p class="auth-lede">If <b id="email-shown"></b> has an account, a code is on its way. It expires in 10 minutes.</p>
      <div class="auth-field">
        <label for="code">6-digit code</label>
        <input type="text" id="code" class="code-input" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6" placeholder="••••••"/>
      </div>
      <div class="auth-field">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" placeholder="••••••••" autocomplete="new-password"/>
        <p class="field-hint">Minimum 8 characters</p>
      </div>
      <div class="auth-field">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password"/>
      </div>
      <button class="auth-submit" id="reset-btn" type="button"><span id="reset-label">Set new password</span></button>
      <button class="auth-secondary" id="resend-btn" type="button" disabled>Resend code</button>
    </section>

    <p class="auth-divider">Remembered it? <a href="/login.html">Log in</a></p>

  </div>
</main>

<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
  Auth.redirectIfLoggedIn('/dashboard.html');
  Nav.render();

  const $ = id => document.getElementById(id);
  const alertEl = $('alert');
  let email = (new URLSearchParams(window.location.search).get('email') || '').trim();
  if (email) $('email').value = email;

  function show(msg, kind) {
    alertEl.textContent = msg;
    alertEl.className = 'auth-alert' + (kind && kind !== 'error' ? ' ' + kind : '');
    alertEl.hidden = false;
  }
  async function postJson(url, body) {
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    return { res, data };
  }

  // ── Resend countdown ──
  let timer, until = 0;
  function startCooldown(seconds) { until = Date.now() + seconds * 1000; clearInterval(timer); run(); timer = setInterval(run, 500); }
  function run() {
    const left = Math.ceil((until - Date.now()) / 1000), b = $('resend-btn');
    if (left > 0) { b.disabled = true; b.textContent = 'Resend code in ' + left + 's'; }
    else { b.disabled = false; b.textContent = 'Resend code'; clearInterval(timer); }
  }

  function goToStep2() {
    $('step-email').hidden = true; $('step-reset').hidden = false;
    $('step-2').classList.add('on');
    $('title').textContent = 'Enter your code';
    $('email-shown').textContent = email;
    $('code').focus();
  }

  async function requestCode(isResend) {
    const typed = $('email').value.trim();
    if (!isResend) {
      if (!typed || !/^\S+@\S+\.\S+$/.test(typed)) { show('Please enter a valid email address.'); return; }
      email = typed;
    }
    const btn = isResend ? $('resend-btn') : $('send-btn');
    btn.disabled = true; if (!isResend) $('send-label').textContent = 'Sending…';
    alertEl.hidden = true;
    try {
      const { res, data } = await postJson('/api/v1/auth/forgot-password', { email });
      if (res.ok) {
        if (!isResend) goToStep2();
        if (isResend) show('Another code is on its way.', 'info'); else alertEl.hidden = true;   // step 2 already says a code is on its way
        startCooldown(60);
      } else if (res.status === 429) {
        if (!isResend) goToStep2();
        show(data.message || 'Please wait before requesting another code.');
        startCooldown(data.retryAfterSeconds || 60);
      } else {
        show(data.message || 'Could not send a code. Please try again.');
        if (isResend) run();
      }
    } catch { show('Network error. Please try again.'); if (isResend) run(); }
    if (!isResend) { btn.disabled = false; $('send-label').textContent = 'Send code'; }
  }

  async function resetPassword() {
    const code = $('code').value.trim(), newPassword = $('newPassword').value, confirmPassword = $('confirmPassword').value;
    if (!/^\d{6}$/.test(code)) { show('Enter the 6-digit code from the email.'); return; }
    if (newPassword.length < 8) { show('Password must be at least 8 characters.'); return; }
    if (newPassword !== confirmPassword) { show('Passwords do not match.'); return; }

    const btn = $('reset-btn'); btn.disabled = true; $('reset-label').textContent = 'Updating…'; alertEl.hidden = true;
    try {
      const { res, data } = await postJson('/api/v1/auth/reset-password', { email, code, newPassword, confirmPassword });
      if (!res.ok) throw new Error(data.message || 'Could not reset the password.');
      show('Password updated! Taking you to login…', 'success');
      setTimeout(() => window.location.href = '/login.html?notice=reset', 800);
    } catch (err) {
      show(err.message);
      btn.disabled = false; $('reset-label').textContent = 'Set new password';
    }
  }

  $('code').addEventListener('input', () => { $('code').value = $('code').value.replace(/\D/g, '').slice(0, 6); });
  $('send-btn').addEventListener('click', () => requestCode(false));
  $('resend-btn').addEventListener('click', () => requestCode(true));
  $('reset-btn').addEventListener('click', resetPassword);
  $('email').addEventListener('keydown', e => { if (e.key === 'Enter') requestCode(false); });
  ['code', 'newPassword', 'confirmPassword'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') resetPassword(); }));
</script>
</body>
</html>
