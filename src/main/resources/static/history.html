<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Session History — Dispatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/nav.css"/>
<link rel="stylesheet" href="css/dashboard.css"/>
</head>
<body>

<div id="site-nav"></div>

<main class="dash-page wrap">

  <div class="dash-header">
    <p class="dash-eyebrow">Browser session only</p>
    <h1 class="dash-title">Session History</h1>
    <p class="dash-sub">
      URLs you've created during this browser session — stored only in this tab, never on the server.
      Closing or refreshing the tab will clear this list.
      <span id="auth-note" hidden>
        Want permanent history?
        <a href="/dashboard.html">Go to My Dispatches →</a>
      </span>
    </p>
  </div>

  <div id="history-wrap"></div>

</main>

<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
  Nav.render();

  // If logged in, show a pointer to the dashboard
  if (Auth.isLoggedIn()) {
    document.getElementById('auth-note').hidden = false;
  }

  const SESSION_KEY = 'dispatch_session_history';

  function getHistory() {
    try { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || '[]'); }
    catch { return []; }
  }

  function saveHistory(urls) {
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(urls));
  }

  function fmt(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function esc(str) {
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function statusOf(u) {
    if (!u.expiresAt) return 'Active';
    return new Date(u.expiresAt) < new Date() ? 'Expired' : 'Active';
  }

  function render() {
    const urls = getHistory();
    const wrap = document.getElementById('history-wrap');

    if (urls.length === 0) {
      wrap.innerHTML = `
        <div class="dash-empty">
          <div class="dash-empty-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <h3>No URLs dispatched in this session.</h3>
          <p>URLs you create on the home page will appear here until you close this tab.</p>
          <a href="/index.html">Create Short URL</a>
        </div>`;
      return;
    }

    wrap.innerHTML = `
      <div class="dash-table-wrap">
        <table class="dash-table history-table">
          <thead>
            <tr>
              <th>Original URL</th>
              <th>Short URL</th>
              <th>Management Key</th>
              <th>Created</th>
              <th>Expires</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="history-tbody">
            ${urls.map((u, i) => `
              <tr data-idx="${i}">
                <td class="td-url" title="${esc(u.longUrl)}">${esc(u.longUrl)}</td>
                <td class="td-short">
                  <button class="short-code-chip" data-code="${esc(u.shortCode)}" data-url="${esc(u.shortUrl)}" title="Click to copy short link">
                    <span class="code-txt">${esc(u.shortCode)}</span>
                    <span class="copy-hint" aria-hidden="true">copy</span>
                  </button>
                </td>
                <td class="td-key">
                  ${u.managementKey
                    ? `<code class="key-code" data-key="${esc(u.managementKey)}" title="Click to copy">${esc(u.managementKey)}</code>`
                    : `<span class="td-key-missing">—</span>`}
                </td>
                <td>${fmt(u.createdAt)}</td>
                <td>${u.expiresAt ? fmt(u.expiresAt) : 'Never'}</td>
                <td><span class="badge badge-${statusOf(u) === 'Active' ? 'active' : 'expired'}">${statusOf(u)}</span></td>
                <td class="td-actions">
                  ${u.managementKey ? `
                  <button class="action-btn track-row-btn" data-code="${esc(u.shortCode)}" data-key="${esc(u.managementKey)}" title="Track this parcel">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    Track
                  </button>` : ''}
                  <button class="action-btn copy-btn" data-url="${esc(u.shortUrl)}" title="Copy short URL">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    Copy
                  </button>
                  <a class="action-btn" href="${esc(u.shortUrl)}" target="_blank" rel="noopener">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                    Open
                  </a>
                  <button class="action-btn del remove-btn" data-idx="${i}" title="Remove from session">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    Remove
                  </button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;

    document.querySelectorAll('.key-code').forEach(el => {
      el.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(el.dataset.key);
          const original = el.textContent;
          el.textContent = 'Copied ✓';
          el.classList.add('copied');
          setTimeout(() => { el.textContent = original; el.classList.remove('copied'); }, 1400);
        } catch {}
      });
    });

    document.querySelectorAll('.track-row-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        // Hands off to the home page's tracking section, pre-filled and
        // auto-run — see the autoTrackFromLink() handler in app.js.
        const params = new URLSearchParams({ trackCode: btn.dataset.code, trackKey: btn.dataset.key });
        window.location.href = `/index.html?${params.toString()}`;
      });
    });

    document.querySelectorAll('.short-code-chip').forEach(chip => {
      chip.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(chip.dataset.url || chip.dataset.code);
          const origContent = chip.innerHTML;
          chip.innerHTML = '<span class="code-txt" style="color:var(--success,#2D6A4F)">✓ Copied!</span>';
          chip.classList.add('copied');
          setTimeout(() => {
            chip.innerHTML = origContent;
            chip.classList.remove('copied');
          }, 1400);
        } catch {}
      });
    });

    document.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(btn.dataset.url);
          btn.textContent = '✓ Copied';
          btn.classList.add('copied');
          setTimeout(() => { btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy`; btn.classList.remove('copied'); }, 1800);
        } catch {}
      });
    });

    document.querySelectorAll('.remove-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx, 10);
        const urls = getHistory();
        urls.splice(idx, 1);
        saveHistory(urls);
        render(); // re-render with updated list
      });
    });
  }

  render();
</script>
</body>
</html>
